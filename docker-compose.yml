services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: central
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - central-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U central -d central"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CC_DATABASE_URL: postgresql+psycopg://central:${POSTGRES_PASSWORD}@database:5432/central
      CC_ADMIN_KEY: ${CC_ADMIN_KEY:?set CC_ADMIN_KEY}
      CC_PUBLIC_URL: ${CC_PUBLIC_URL:?set CC_PUBLIC_URL}
      CC_SECRET_ENCRYPTION_KEY: ${CC_SECRET_ENCRYPTION_KEY:?set CC_SECRET_ENCRYPTION_KEY}
      CC_ALLOW_INSECURE_HTTP: "false"
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  central-database: